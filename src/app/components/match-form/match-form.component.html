<form
  class="match-form"
  [formGroup]="form"
  (ngSubmit)="submit()"
>

  <div class="form-header">
    <h2>
      {{ mode === 'create'
      ? 'Créer un match'
      : 'Modifier le match' }}
    </h2>
  </div>

  <div class="form-grid">

    <div class="form-group">
      <label>Date et heure</label>
      <input
        type="datetime-local"
        formControlName="match_date"
      >
    </div>

    <div class="form-group">
      <label>Compétition</label>

      <select formControlName="competition_id">
        <option [ngValue]="null">
          Aucune compétition
        </option>

        <option
          *ngFor="let competition of competitions"
          [value]="competition.id"
        >
          {{ competition.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Équipe domicile</label>

      <select formControlName="home_team_id">
        <option [ngValue]="null">Choisir...</option>

        <option
          *ngFor="let team of teams"
          [value]="team.id"
        >
          {{ team.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Équipe extérieure</label>

      <select formControlName="away_team_id">
        <option [ngValue]="null">Choisir...</option>

        <option
          *ngFor="let team of teams"
          [value]="team.id"
        >
          {{ team.name }}
        </option>
      </select>
    </div>

    <div class="form-group">
      <label>Lieu</label>

      <input
        type="text"
        formControlName="venue"
        placeholder="Stade Boréale"
      >
    </div>

    <div class="form-group">
      <label>Statut</label>

      <select formControlName="status">
        <option value="scheduled">
          Programmé
        </option>

        <option value="played">
          Joué
        </option>

        <option value="cancelled">
          Annulé
        </option>
      </select>
    </div>

  </div>

  <div class="score-section">

    <h3>Résultat</h3>

    <div class="score-grid">

      <div class="form-group">
        <label>Buts domicile</label>
        <input
          type="number"
          min="0"
          formControlName="home_score"
        >
      </div>

      <div class="form-group">
        <label>Buts extérieur</label>
        <input
          type="number"
          min="0"
          formControlName="away_score"
        >
      </div>

    </div>

  </div>

  <div class="formation-section">

    <h3>Formations</h3>

    <div class="score-grid">

      <div class="form-group">
        <label>Formation domicile</label>

        <input
          type="text"
          formControlName="home_formation"
          placeholder="4-3-3"
        >
      </div>

      <div class="form-group">
        <label>Formation extérieur</label>

        <input
          type="text"
          formControlName="away_formation"
          placeholder="4-2-3-1"
        >
      </div>

    </div>

  </div>

  <button
    type="submit"
    class="submit-btn"
    [disabled]="loading"
  >
    {{ mode === 'create'
      ? 'Créer le match'
      : 'Enregistrer les modifications' }}
  </button>

</form>
